# The joined app. scripts/deploy.mjs swaps in each variant's id and name for its deploy:
# valuelens-fabric-app, consumption-central-fabric-app or valuelens-consumption-central.
# Never use the id `valuelens`: an older app deploys under it.
id: valuelens-consumption-central
name: ValueLens + Consumption Central
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  # Holds the rates and Capacity Pack balance typed in on the Consumption page.
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
