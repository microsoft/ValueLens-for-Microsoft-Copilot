name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Verify PowerShell 7 is available
        run: pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required" }'
      - name: Run offline regression tests
        # Baseline 07f49e2: do not rebuild templates or change runtime code in this hygiene PR.
        # Dataverse: stale generated PBIT; fallback/inventory defaults are null, not false;
        # snapshot filter is now server-side OData; report assets differ from SharePoint.
        # Registry: the test extracts cell 6, but the three helpers now live in cell 11.
        # Remove each exact exclusion when its separate contract/template fix lands.
        # PySpark/Java are optional: the existing local-Spark check skips without them.
        run: >-
          python -B -m pytest tests -q -ra
          --deselect=tests/test_power_automate_dataverse_path.py::PowerAutomateDataversePathTests::test_builder_is_idempotent
          --deselect=tests/test_power_automate_dataverse_path.py::PowerAutomateDataversePathTests::test_dataverse_parameter_and_query_added
          --deselect=tests/test_power_automate_dataverse_path.py::PowerAutomateDataversePathTests::test_inventory_is_genuinely_optional_and_keys_are_validated
          --deselect=tests/test_power_automate_dataverse_path.py::PowerAutomateDataversePathTests::test_pinned_snapshot_manifest_guards_all_core_reads
          --deselect=tests/test_power_automate_dataverse_path.py::PowerAutomateDataversePathTests::test_template_report_is_inherited_unchanged
          --deselect=tests/test_snapshot_safety.py::SnapshotSafetyTests::test_registry_helpers_reject_malformed_pages_details_and_duplicate_keys
