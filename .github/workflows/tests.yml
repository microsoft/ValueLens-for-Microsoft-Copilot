name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1 duckdb==1.5.5 pandas==3.0.5 urllib3==2.7.0 requests==2.32.5
      - name: Verify PowerShell 7 is available
        run: pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required" }'
      - name: Run offline regression tests
        # PySpark/Java are optional: the existing local-Spark check skips without them.
        run: python -B -m pytest tests -q -ra

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: '1. Fabric/installer'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        run: node packaging/public-registry.js package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  valuelens-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the public npm registry
        run: node "1. Fabric/installer/packaging/public-registry.js" "2. Azure/web/package-lock.json"
      - name: Install and test
        working-directory: '2. Azure/web'
        run: |
          npm ci --no-audit --no-fund
          npm test

  valuelens-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The tests import dependency-free modules only, so no npm install is needed.
      - name: Test the app's data checks
        working-directory: app
        run: npm test

  arm-drift:
    # The installer ships a compiled copy of 2. Azure/infra; it must match the Bicep source.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Bicep template
        run: |
          az bicep install
          az bicep build --file "2. Azure/infra/main.bicep" --outfile "$RUNNER_TEMP/main.arm.json"
      - name: Compare with the installer's copy
        shell: python
        run: |
          import json, os, sys
          # Ignore which Bicep version compiled the template and each nested module.
          def strip(node):
              if isinstance(node, dict):
                  if isinstance(node.get("metadata"), dict):
                      node["metadata"].pop("_generator", None)
                  for value in node.values():
                      strip(value)
              elif isinstance(node, list):
                  for value in node:
                      strip(value)
              return node
          def load(p):
              return strip(json.load(open(p, encoding="utf-8")))
          built = load(os.path.join(os.environ["RUNNER_TEMP"], "main.arm.json"))
          shipped = load("1. Fabric/installer/src/azure/main.arm.json")
          if built != shipped:
              sys.exit("1. Fabric/installer/src/azure/main.arm.json is out of date: rebuild it from 2. Azure/infra/main.bicep.")
          print("ARM template matches the Bicep source.")