name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Parity tests compare against Analytics Hub (tests/analytics_hub.py). Sibling checkouts, so the
      # template scans under this repo don't pick up the Fabric templates.
      ANALYTICS_HUB_ROOT: ${{ github.workspace }}/analytics-hub
    defaults:
      run:
        working-directory: valuelens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: valuelens
      - name: Check out Analytics Hub (pinned release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/AnalyticsHub-Dashboard
          # Move the pin in the same PR that brings a copied rule or shared measure in line (CONTRIBUTING.md).
          ref: installer-v0.5.0
          path: analytics-hub
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test runner
        # pandas, urllib3 and requests are imported by the Analytics Hub notebook code the parity tests load.
        run: python -m pip install pytest==9.1.1 pandas==3.0.5 urllib3==2.7.0 requests==2.32.5
      - name: Verify PowerShell 7 is available
        run: pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required" }'
      - name: Run offline regression tests
        run: python -B -m pytest tests -q -ra
