name: installer-exe

# Builds AnalyticsHubInstaller.exe, the download that runs the Fabric installer without a clone
# of this repo or a terminal. A tag such as installer-v0.1.0 also drafts a release with it, to
# publish by hand.
#
# Signing: the exe is Authenticode-signed with ESRP outside this workflow (see
# packaging/sign-installer.azure-pipelines.yml), which replaces the draft's exe, .sha256 and notes.
# Publishing a release runs the check below. With the repo variable REQUIRE_SIGNED_INSTALLER set to
# true, it turns an unsigned release back into a draft, so releases/latest keeps the last good one.

on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']
  pull_request:
    paths:
      - '1. Fabric/installer/packaging/**'
      # The exe bundles the app with the rayfin version from its lock file.
      - '1. Fabric/Fabric App/package.json'
      - '1. Fabric/Fabric App/package-lock.json'
      - '.github/workflows/installer-exe.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the installer exe
    if: github.event_name != 'release'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: this job builds the exe that gets released.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the tag matches the installer's version
        if: startsWith(github.ref, 'refs/tags/installer-v')
        working-directory: '1. Fabric/installer'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "installer-v$version") { throw "Tag $env:TAG doesn't match the installer's version $version." }

      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        working-directory: '1. Fabric/installer'
        run: node packaging/public-registry.js "../Fabric App/package-lock.json" package-lock.json

      - name: Install the app's dependencies
        working-directory: '1. Fabric/Fabric App'
        run: npm ci --no-audit --no-fund

      - name: Install the installer's dependencies
        working-directory: '1. Fabric/installer'
        run: npm ci --no-audit --no-fund

      - name: Test the installer
        working-directory: '1. Fabric/installer'
        run: npm test

      - name: Type-check the installer
        working-directory: '1. Fabric/installer'
        run: npm run typecheck

      - name: Build the exe
        working-directory: '1. Fabric/installer'
        run: npm run build:exe -- --release --out "$env:RUNNER_TEMP\exe"

      - name: Smoke-test the exe
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'exe\AnalyticsHubInstaller.exe'
          & $exe --version
          if ($LASTEXITCODE) { throw "--version failed with exit code $LASTEXITCODE." }
          $preview = Join-Path $env:RUNNER_TEMP 'preview'
          & $exe preview --config (Join-Path $env:RUNNER_TEMP 'smoke.json') --out $preview
          if ($LASTEXITCODE) { throw "preview failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $preview 'model.bim'))) { throw 'preview wrote no model.bim.' }

      # Run on the exe that gets published, after any signing: signing changes the hash.
      - name: Check the signature, write the hash and the release notes
        working-directory: '1. Fabric/installer'
        run: node packaging/finish-exe.js "$env:RUNNER_TEMP\exe\AnalyticsHubInstaller.exe" --notes "$env:RUNNER_TEMP\release-notes.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnalyticsHubInstaller
          path: |
            ${{ runner.temp }}\exe\AnalyticsHubInstaller.exe
            ${{ runner.temp }}\exe\AnalyticsHubInstaller.exe.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}\release-notes.md
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/installer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the draft release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AnalyticsHubInstaller
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" AnalyticsHubInstaller.exe AnalyticsHubInstaller.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --draft \
            --notes-file notes/release-notes.md \
            --title "Analytics Hub installer ${TAG#installer-v}"

  check-published:
    name: Check the published exe
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'installer-v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # Turn a release that fails the check back into a draft.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the published exe
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP\published" --pattern AnalyticsHubInstaller.exe --pattern AnalyticsHubInstaller.exe.sha256

      - name: Check its signature and hash
        working-directory: '1. Fabric/installer'
        env:
          REQUIRE_SIGNED: ${{ vars.REQUIRE_SIGNED_INSTALLER }}
        run: |
          $require = if ($env:REQUIRE_SIGNED -eq 'true') { '--require-signed' } else { $null }
          node packaging/finish-exe.js "$env:RUNNER_TEMP\published\AnalyticsHubInstaller.exe" --check-hash $require
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Turn the release back into a draft
        if: failure()
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=true
          Write-Output "::error::$env:TAG is a draft again. Fix the exe or its .sha256, then publish it again."
