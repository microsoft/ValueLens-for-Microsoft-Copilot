name: azure-images

# Builds the two container images the Azure-hosted Analytics Hub runs: valuelens-jobs (collect,
# process, publish, refresh) and valuelens-web (the app and its /api/query proxy). The installer
# deploys ghcr.io/microsoft/<image>:<installer version>, so an installer-v* tag pushes both images
# with that version. Pull requests, and manual runs on a branch, only check that they build.
#
# Only the publish job, which runs for installer-v* tags alone, gets a token that can write
# packages. It runs the build job's steps (the YAML anchors below), so a pull request tests
# everything publishing does apart from the push.

on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']
  pull_request:
    paths:
      - '2. Azure/jobs/**'
      - '2. Azure/web/**'
      - '2. Azure/sql/**'
      - 'shared/python/**'
      - '1. Fabric/Fabric App/**'
      - '.github/workflows/azure-images.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: &strategy
      fail-fast: false
      matrix:
        image: [valuelens-jobs, valuelens-web]
    env: &env
      IMAGE_NAME: ${{ matrix.image }}
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        if: matrix.image == 'valuelens-web'
        run: node "1. Fabric/installer/packaging/public-registry.js" "1. Fabric/Fabric App/package-lock.json" "2. Azure/web/package-lock.json"

      - name: Work out the tag
        id: tag
        run: |
          version=$(node -p "require('./1. Fabric/installer/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/installer-v* && "$GITHUB_REF_NAME" != "installer-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the installer's version $version." >&2; exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME:$version" >> "$GITHUB_OUTPUT"

      # The source label links the package on GHCR to this repo.
      - name: Build
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker build -f "2. Azure/${IMAGE_NAME#valuelens-}/Dockerfile" -t "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .

      - name: Smoke-test the jobs image
        if: matrix.image == 'valuelens-jobs'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: docker run --rm "$IMAGE" --help

      # Skipped in the build job, which never runs for a tag.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/installer-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  publish:
    name: Publish ${{ matrix.image }}
    if: startsWith(github.ref, 'refs/tags/installer-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push the images to GHCR.
    strategy: *strategy
    env: *env
    steps: *steps
