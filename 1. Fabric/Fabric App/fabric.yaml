activeProfile: default
profiles:
  default:
    semanticModels:
      vl:
        workspaceId: "<ValueLens workspace ID>"
        itemId: "<ValueLens semantic model ID>"
      cc:
        workspaceId: "<Consumption Central workspace ID>"
        itemId: "<Consumption Central semantic model ID>"
      ae:
        workspaceId: "<Agent Evaluator workspace ID>"
        itemId: "<Agent Evaluator semantic model ID>"
